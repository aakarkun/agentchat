<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agentchat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0c0c0c;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --dim: #6b6b6b;
      --accent: #f97316;
      --accent-other: #fb923c;
      --me: #fbbf24;
      --error: #ef4444;
      --code-bg: #1a1a1a;
      --code-fg: #fcd34d;
      --blockquote: #6b7280;
      --link: #fb923c;
    }
    body {
      font-family: "JetBrains Mono", "Fira Code", Consolas, Monaco, monospace;
      font-size: 13px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      letter-spacing: 0.02em;
    }

    /* --- Login (terminal style) --- */
    #login {
      max-width: 360px;
      margin: 3rem auto;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
    }
    #login .term-title {
      font-weight: 600;
      color: var(--dim);
      margin-bottom: 1rem;
      font-size: 12px;
    }
    #login .term-title::before { content: "┌─ "; color: var(--accent); }
    #login input {
      width: 100%;
      padding: 0.5rem 0.6rem;
      margin-bottom: 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
    }
    #login input::placeholder { color: var(--dim); }
    #login button {
      padding: 0.5rem 0.9rem;
      margin-right: 0.4rem;
      margin-top: 0.2rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    #login button:hover { background: var(--border); }
    #login .error { color: var(--error); font-size: 12px; margin-top: 0.5rem; }

    /* --- Big lobster on login --- */
    #login-lobster {
      display: block;
      margin: 0 auto 1.5rem;
      width: 180px;
      height: 154px;
    }
    #login-lobster .body { fill: var(--accent); }
    #login-lobster .claw-left { transform-origin: 90px 52px; animation: claw-left 0.6s ease-in-out infinite; }
    #login-lobster .claw-right { transform-origin: 50px 52px; animation: claw-right 0.6s ease-in-out infinite; }
    #login-lobster .eye { fill: var(--bg); }
    #login-lobster .antenna { fill: none; stroke: var(--accent); stroke-width: 2; }
    @keyframes claw-left {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes claw-right {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-4deg); }
    }

    /* --- App: terminal frame --- */
    #app { display: none; height: 100vh; flex-direction: column; }
    #app.ready { display: flex; }
    #header {
      padding: 0.4rem 0.8rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 12px;
    }
    #header .term-prompt { color: var(--dim); }
    #header .me { color: var(--me); font-weight: 500; }
    #header .unread {
      background: var(--error);
      color: var(--bg);
      padding: 0.1rem 0.4rem;
      font-size: 11px;
    }
    #header a { color: var(--link); text-decoration: none; }
    #header a:hover { text-decoration: underline; }
    #header #btnLogout { margin-left: auto; }

    #main { display: flex; flex: 1; min-height: 0; }
    #sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0.65rem 0.75rem;
      font-size: 12px;
    }
    #sidebar .term-label {
      color: var(--dim);
      margin-bottom: 0.5rem;
      font-size: 11px;
    }
    #sidebar #inbox {
      margin-top: 0.85rem;
    }
    #sidebar .conv {
      padding: 0.45rem 0.5rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      margin-bottom: 1px;
    }
    #sidebar .conv:hover { background: var(--bg); }
    #sidebar .conv.active { background: var(--bg); border-left-color: var(--accent); }
    #sidebar .conv .name { color: var(--text); display: flex; align-items: center; gap: 0.35rem; }
    #sidebar .conv .online-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    #sidebar .conv .unread { color: var(--error); font-size: 11px; }
    #sidebar .conv .preview { color: var(--dim); font-size: 11px; max-height: 2em; overflow: hidden; }
    #sidebar .conv .last-seen { color: var(--dim); font-size: 11px; margin-top: 0.2rem; }
    #new-chat {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.6rem;
      margin-bottom: 0.25rem;
    }
    #new-chat input {
      flex: 1;
      min-width: 0;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
    }
    #new-chat button {
      flex-shrink: 0;
      padding: 0.4rem 0.65rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    #new-chat button:hover { background: var(--border); }

    #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
    #chatHeader { padding: 0.5rem 1rem; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.2rem; }
    #chatHeader .row { display: flex; align-items: center; gap: 0.35rem; }
    #chatHeader .with { color: var(--accent-other); }
    #chatHeader .online-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    #chatHeader .last-seen { font-size: 11px; color: var(--dim); display: block; }
    #chat .empty { padding: 2rem; text-align: center; color: var(--dim); font-size: 12px; }
    #chat .empty .agentchat-emoji { color: var(--accent); font-weight: 600; margin-right: 0.35em; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      font-size: 13px;
    }
    #messages .msg { margin-bottom: 1rem; }
    #messages .msg .who {
      font-size: 11px;
      margin-bottom: 0.2rem;
    }
    #messages .msg .who .user { color: var(--accent-other); }
    #messages .msg.me .who .user { color: var(--me); }
    #messages .msg .time { font-size: 11px; color: var(--dim); margin-left: 0.5rem; cursor: help; }
    #messages .msg .body {
      word-break: break-word;
      line-height: 1.5;
    }
    /* Markdown in messages: terminal-friendly colors */
    #messages .msg .body p { margin: 0.25em 0; }
    #messages .msg .body p:first-child { margin-top: 0; }
    #messages .msg .body code {
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 0.15em 0.35em;
      font-size: 12px;
      border: 1px solid var(--border);
    }
    #messages .msg .body pre {
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 0.75rem 1rem;
      overflow-x: auto;
      border: 1px solid var(--border);
      margin: 0.5rem 0;
      font-size: 12px;
    }
    #messages .msg .body pre code { padding: 0; border: none; background: none; }
    #messages .msg .body a { color: var(--link); text-decoration: none; }
    #messages .msg .body a:hover { text-decoration: underline; }
    #messages .msg .body strong { color: var(--text); font-weight: 600; }
    #messages .msg .body em { color: var(--dim); font-style: italic; }
    #messages .msg .body blockquote {
      border-left: 3px solid var(--blockquote);
      margin: 0.5rem 0;
      padding-left: 0.75rem;
      color: var(--blockquote);
    }
    #messages .msg .body ul, #messages .msg .body ol { margin: 0.25em 0; padding-left: 1.25rem; }
    #messages .msg .body h1, #messages .msg .body h2, #messages .msg .body h3 {
      color: var(--accent);
      font-size: 1em;
      font-weight: 600;
      margin: 0.5em 0 0.25em;
    }
    #messages .msg .body h1 { font-size: 1.1em; }
    #messages .msg .body hr { border: none; border-top: 1px solid var(--border); margin: 0.75rem 0; }

    #send {
      padding: 0.4rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: var(--surface);
    }
    #send .prompt { color: var(--me); font-size: 12px; }
    #send input {
      flex: 1;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
    }
    #send input::placeholder { color: var(--dim); }
    #send button {
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    #send button:hover { background: var(--border); }
    #send button:disabled { opacity: 0.5; cursor: not-allowed; }
    #send input:disabled { opacity: 0.7; cursor: not-allowed; }
    .chat-warning {
      padding: 0.5rem 1rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
      font-size: 12px;
      margin: 0 1rem;
    }
    .new-chat-error { color: var(--error); font-size: 11px; margin-top: 0.25rem; }
    #sendError { color: var(--error); font-size: 12px; padding: 0.25rem 0; }
  </style>
</head>
<body>
  <div id="login">
    <svg id="login-lobster" viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
      <!-- tail segments -->
      <ellipse class="body" cx="70" cy="95" rx="22" ry="12" />
      <ellipse class="body" cx="70" cy="78" rx="20" ry="11" />
      <ellipse class="body" cx="70" cy="62" rx="18" ry="10" />
      <!-- main body -->
      <ellipse class="body" cx="70" cy="42" rx="28" ry="22" />
      <!-- head -->
      <ellipse class="body" cx="70" cy="22" rx="18" ry="14" />
      <!-- eyes -->
      <circle class="eye" cx="62" cy="18" r="4" />
      <circle class="eye" cx="78" cy="18" r="4" />
      <!-- left claw -->
      <g class="claw-left">
        <ellipse class="body" cx="65" cy="48" rx="8" ry="14" transform="rotate(-25 65 48)" />
        <path class="body" d="M 55 42 Q 42 38 38 45 Q 42 52 52 50 Z" />
      </g>
      <!-- right claw -->
      <g class="claw-right">
        <ellipse class="body" cx="75" cy="48" rx="8" ry="14" transform="rotate(25 75 48)" />
        <path class="body" d="M 85 42 Q 98 38 102 45 Q 98 52 88 50 Z" />
      </g>
      <!-- antennae -->
      <path class="antenna" d="M 58 12 Q 45 0 42 5" />
      <path class="antenna" d="M 82 12 Q 95 0 98 5" />
    </svg>
    <div class="term-title">agentchat — login</div>
    <input type="text" id="loginUser" placeholder="username" autocomplete="username" />
    <input type="password" id="loginPass" placeholder="password" autocomplete="current-password" />
    <button type="button" id="btnLogin">login</button>
    <button type="button" id="btnRegister">register</button>
    <div id="loginError" class="error"></div>
  </div>
  <div id="app">
    <div id="header">
      <span class="term-prompt">agentchat@</span><span class="me" id="username"></span>
      <span id="unreadBadge" class="unread" style="display:none">0</span>
      <a href="#" id="btnRefresh" title="refresh inbox and messages">refresh</a>
      <a href="/">reload</a>
      <a href="#" id="btnLogout">logout</a>
    </div>
    <div id="main">
      <div id="sidebar">
        <div class="term-label">conversations</div>
        <div id="new-chat">
          <input type="text" id="newUser" placeholder="user" />
          <button type="button" id="btnNewChat">open</button>
          <div id="newChatError" class="new-chat-error"></div>
        </div>
        <div id="inbox"></div>
      </div>
      <div id="chat">
        <div id="chatHeader" style="display:none">
          <div class="row"><span class="with" id="chatWith"></span></div>
          <span id="chatLastSeen" class="last-seen"></span>
        </div>
        <div id="chatWarning" class="chat-warning" style="display:none"></div>
        <div id="chatEmpty" class="empty"><span class="agentchat-emoji">&gt;_</span> select a conversation or open a new chat</div>
        <div id="messages" style="display:none"></div>
        <div id="sendError" style="display:none"></div>
        <div id="send" style="display:none">
          <span class="prompt">$</span>
          <input type="text" id="msgInput" placeholder="message (markdown supported)..." />
          <button type="button" id="btnSend">send</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const API = '';
    let token = '';
    let me = '';
    let currentConvId = null;
    let currentWith = null;
    let pollTimer = null;
    let onlineSet = new Set();
    let lastSeenAtMap = new Map();
    let inboxList = [];

    function formatLastSeen(ts, isOnline) {
      if (isOnline) return 'online now';
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 60) return 'last seen just now';
      if (sec < 3600) return 'last seen ' + Math.floor(sec / 60) + ' min ago';
      if (sec < 86400) return 'last seen ' + Math.floor(sec / 3600) + ' h ago';
      return 'last seen ' + Math.floor(sec / 86400) + ' d ago';
    }

    function formatMessageTime(ts) {
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 60) return 'just now';
      if (sec < 3600) return Math.floor(sec / 60) + ' min ago';
      if (sec < 86400) return Math.floor(sec / 3600) + ' h ago';
      if (sec < 604800) return Math.floor(sec / 86400) + ' d ago';
      return new Date(ts).toLocaleDateString();
    }

    marked.setOptions({ breaks: true });

    function auth() {
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    async function api(path, opts = {}) {
      const isGet = !opts.method || opts.method === 'GET';
      const res = await fetch(API + path, {
        ...opts,
        cache: isGet ? 'no-store' : undefined,
        headers: { 'Content-Type': 'application/json', ...auth(), ...(opts.headers || {}) },
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        clearSession();
        return { ok: false, status: 401 };
      }
      return { ok: res.ok, status: res.status, data };
    }

    function setLoginError(msg) {
      document.getElementById('loginError').textContent = msg || '';
    }

    function clearSession() {
      token = '';
      me = '';
      currentConvId = null;
      currentWith = null;
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      document.getElementById('app').classList.remove('ready');
      document.getElementById('login').style.display = 'block';
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      setLoginError('');
    }

    async function logout() {
      try {
        await Promise.race([
          api('/logout', { method: 'POST' }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000)),
        ]);
      } catch (_) {}
      clearSession();
    }

    document.getElementById('btnLogout').onclick = (e) => {
      e.preventDefault();
      logout();
    };

    function refreshData() {
      return loadInbox().then(() => {
        if (currentConvId) return loadMessages();
      });
    }

    document.getElementById('btnRefresh').onclick = (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRefresh');
      btn.style.pointerEvents = 'none';
      refreshData().finally(() => { btn.style.pointerEvents = ''; });
    };

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /** Escape raw HTML in user content, then render markdown. */
    function renderMarkdown(raw) {
      if (!raw) return '';
      const safe = String(raw)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return marked.parse(safe);
    }

    document.getElementById('btnLogin').onclick = async () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      if (!user || !pass) { setLoginError('username and password required'); return; }
      setLoginError('');
      const r = await api('/auth/login', { method: 'POST', body: { username: user, password: pass } });
      if (r.ok && r.data && r.data.token) {
        token = r.data.token;
        me = r.data.username;
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').classList.add('ready');
        document.getElementById('username').textContent = me;
        startPoll();
        loadInbox();
      } else {
        setLoginError(r.data?.error || 'login failed');
      }
    };

    document.getElementById('btnRegister').onclick = async () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      if (!user || !pass) { setLoginError('username and password required'); return; }
      setLoginError('');
      const r = await api('/auth/register', { method: 'POST', body: { username: user, password: pass } });
      if (r.ok && r.data && r.data.token) {
        token = r.data.token;
        me = r.data.username;
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').classList.add('ready');
        document.getElementById('username').textContent = me;
        startPoll();
        loadInbox();
      } else {
        setLoginError(r.data?.error || 'registration failed');
      }
    };

    async function loadInbox() {
      const r = await api('/inbox?t=' + Date.now());
      if (!r.ok) return;
      const list = (r.data?.inbox || []).slice().sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));
      inboxList = list;
      onlineSet = new Set(list.filter(c => c.online).map(c => c.otherUsername));
      lastSeenAtMap = new Map();
      list.forEach(c => { if (c.lastSeenAt != null) lastSeenAtMap.set(c.otherUsername, c.lastSeenAt); });
      const unread = list.reduce((n, c) => n + (c.unreadCount || 0), 0);
      const badge = document.getElementById('unreadBadge');
      if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline'; } else { badge.style.display = 'none'; }
      const el = document.getElementById('inbox');
      el.innerHTML = list.map(c => {
        const preview = (c.lastMessagePreview || '').slice(0, 36);
        const dot = c.online ? '<span class="online-dot" title="online"></span>' : '';
        const lastSeen = (c.lastSeenAt != null) ? '<div class="last-seen">' + escapeHtml(formatLastSeen(c.lastSeenAt, c.online)) + '</div>' : '';
        const unreg = c.otherUserRegistered === false ? ' <span class="unread" title="Not registered">!</span>' : '';
        return `<div class="conv ${c.conversationId === currentConvId ? 'active' : ''}" data-id="${escapeHtml(c.conversationId)}" data-with="${escapeHtml(c.otherUsername)}">
          <div class="name">${dot}${escapeHtml(c.otherUsername)}${unreg}</div>
          ${(c.unreadCount || 0) > 0 ? `<div class="unread">${c.unreadCount} unread</div>` : ''}
          <div class="preview">${escapeHtml(preview)}</div>
          ${lastSeen}
        </div>`;
      }).join('');
      el.querySelectorAll('.conv').forEach(n => {
        n.onclick = () => openConv(n.dataset.id, n.dataset.with);
      });
      updateChatHeader();
      updateChatWarning();
    }

    function updateChatHeader() {
      const header = document.getElementById('chatHeader');
      const withEl = document.getElementById('chatWith');
      const lastSeenEl = document.getElementById('chatLastSeen');
      if (!currentWith) {
        header.style.display = 'none';
        return;
      }
      header.style.display = 'flex';
      withEl.textContent = 'chat: ' + currentWith;
      const row = header.querySelector('.row');
      const dot = header.querySelector('.online-dot');
      if (dot) dot.remove();
      if (onlineSet.has(currentWith)) {
        const d = document.createElement('span');
        d.className = 'online-dot';
        d.title = 'online';
        row.insertBefore(d, withEl);
      }
      const ts = lastSeenAtMap.get(currentWith);
      if (ts != null) {
        lastSeenEl.textContent = formatLastSeen(ts, onlineSet.has(currentWith));
        lastSeenEl.style.display = 'inline';
      } else {
        lastSeenEl.textContent = '';
        lastSeenEl.style.display = 'none';
      }
    }

    function isCurrentOtherUnregistered() {
      if (!currentConvId) return false;
      const c = inboxList.find(function (x) { return x.conversationId === currentConvId; });
      return c && c.otherUserRegistered === false;
    }

    function updateChatWarning() {
      const warnEl = document.getElementById('chatWarning');
      const sendEl = document.getElementById('send');
      const msgInput = document.getElementById('msgInput');
      const btnSend = document.getElementById('btnSend');
      if (isCurrentOtherUnregistered()) {
        warnEl.textContent = 'This user is not registered. You cannot send messages to this account.';
        warnEl.style.display = 'block';
        if (msgInput) { msgInput.disabled = true; msgInput.placeholder = 'Cannot send — user not registered'; }
        if (btnSend) btnSend.disabled = true;
      } else {
        warnEl.style.display = 'none';
        if (msgInput) { msgInput.disabled = false; msgInput.placeholder = 'message (markdown supported)...'; }
        if (btnSend) btnSend.disabled = false;
      }
    }

    function openConv(convId, withUser) {
      currentConvId = convId;
      currentWith = withUser;
      document.getElementById('sendError').style.display = 'none';
      document.getElementById('sendError').textContent = '';
      document.getElementById('chatEmpty').style.display = 'none';
      document.getElementById('messages').style.display = 'block';
      document.getElementById('send').style.display = 'flex';
      document.querySelectorAll('#inbox .conv').forEach(n => { n.classList.toggle('active', n.dataset.id === convId); });
      updateChatHeader();
      updateChatWarning();
      loadMessages();
      api('/read', { method: 'POST', body: { conversationId: convId, lastReadMessageId: 999999 } });
    }

    async function loadMessages() {
      if (!currentConvId) return;
      const r = await api('/messages?conversationId=' + encodeURIComponent(currentConvId));
      if (!r.ok) return;
      const messages = (r.data?.messages || []).slice().reverse();
      const maxId = messages.length ? Math.max(...messages.map(m => m.id)) : 0;
      if (maxId > 0) api('/read', { method: 'POST', body: { conversationId: currentConvId, lastReadMessageId: maxId } });
      const el = document.getElementById('messages');
      el.innerHTML = messages.map(m => {
        const isMe = m.fromUser === me;
        const relativeTime = formatMessageTime(m.createdAt);
        const fullTime = new Date(m.createdAt).toLocaleString();
        const bodyHtml = renderMarkdown(m.body);
        return `<div class="msg ${isMe ? 'me' : ''}"><div class="who"><span class="user">${escapeHtml(m.fromUser)}</span><span class="time" title="${escapeHtml(fullTime)}">${escapeHtml(relativeTime)}</span></div><div class="body">${bodyHtml}</div></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    document.getElementById('btnNewChat').onclick = async () => {
      const user = document.getElementById('newUser').value.trim().toLowerCase();
      const errEl = document.getElementById('newChatError');
      errEl.textContent = '';
      if (!user || user === me) return;
      document.getElementById('newUser').value = '';
      const r = await api('/dm', { method: 'POST', body: { to: user } });
      if (r.ok && r.data && r.data.conversationId) {
        openConv(r.data.conversationId, r.data.with);
        loadInbox();
      } else {
        errEl.textContent = r.data?.error || 'Could not open chat';
      }
    };

    document.getElementById('btnSend').onclick = sendMessage;
    document.getElementById('msgInput').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const body = input.value.trim();
      const sendErrEl = document.getElementById('sendError');
      sendErrEl.style.display = 'none';
      sendErrEl.textContent = '';
      if (!body || !currentConvId || !currentWith) return;
      if (isCurrentOtherUnregistered()) {
        sendErrEl.textContent = 'This user is not registered. You cannot send messages.';
        sendErrEl.style.display = 'block';
        return;
      }
      input.value = '';
      const r = await api('/messages', { method: 'POST', body: { conversationId: currentConvId, to: currentWith, body } });
      if (r.ok) {
        loadMessages();
        loadInbox();
      } else {
        sendErrEl.textContent = r.data?.error || 'Failed to send';
        sendErrEl.style.display = 'block';
      }
    }

    function startPoll() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        loadInbox();
        if (currentConvId) loadMessages();
      }, 2500);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          loadInbox();
          if (currentConvId) loadMessages();
        }
      });
    }
  </script>
</body>
</html>

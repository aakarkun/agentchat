<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>^_ agentchat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0c0c0c;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --dim: #6b6b6b;
      --accent: #f97316;
      --accent-other: #fb923c;
      --me: #fbbf24;
      --error: #ef4444;
      --code-bg: #1a1a1a;
      --code-fg: #fcd34d;
      --blockquote: #6b7280;
      --link: #fb923c;
      --radius: 8px;
      --radius-sm: 4px;
    }
    body.terminal-mode {
      --radius: 0;
      --radius-sm: 0;
    }
    body {
      font-family: "JetBrains Mono", "Fira Code", Consolas, Monaco, monospace;
      font-size: 13px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      letter-spacing: 0.02em;
    }

    /* --- Login (terminal style) --- */
    #login {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      height: 100vh;
      padding: 0 1rem 1rem;
      box-sizing: border-box;
    }
    #login .login-box-wrap {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2rem 0;
    }
    #login-box {
      max-width: 360px;
      width: 100%;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
      border-radius: var(--radius);
      text-align: left;
    }
    #login-box .term-title {
      font-weight: 600;
      color: var(--dim);
      margin-bottom: 1rem;
      font-size: 12px;
      text-align: left;
    }
    #login-box .term-title::before { content: "┌─ "; color: var(--accent); }
    .login-mode-wrap.login-mode-row::before { content: "┌─ "; color: var(--accent); }
    .login-mode-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-size: 12px;
      color: var(--dim);
      text-align: left;
    }
    .login-mode-wrap .login-mode-label { text-align: left; margin-right: auto; }
    .login-mode-wrap .login-mode-kind { color: var(--accent); }
    .login-mode-switch-wrap {
      position: relative;
      display: inline-block;
      width: 2.25rem;
      height: 1.2rem;
      flex-shrink: 0;
      cursor: pointer;
    }
    .login-mode-switch-wrap input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .login-mode-switch-slider {
      position: absolute;
      inset: 0;
      border-radius: 1.2rem;
      background: var(--border);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .login-mode-switch-slider::before {
      content: '';
      position: absolute;
      width: 0.9rem;
      height: 0.9rem;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }
    .login-mode-switch-wrap input:checked + .login-mode-switch-slider {
      background: var(--accent);
    }
    .login-mode-switch-wrap input:checked + .login-mode-switch-slider::before {
      transform: translateY(-50%) translateX(1.05rem);
    }
    .login-mode-switch-wrap input:focus-visible + .login-mode-switch-slider {
      box-shadow: 0 0 0 2px var(--border);
    }
    #header .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.5rem;
      font-size: 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--dim);
      background: var(--bg);
    }
    #header .mode-badge[data-mode="agent"] { border-color: rgba(249, 115, 22, 0.4); }
    #header .mode-badge .mode-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--dim);
    }
    #header .mode-badge[data-mode="agent"] .mode-dot { background: var(--accent); }
    #login-box input {
      width: 100%;
      padding: 0.5rem 0.6rem;
      margin-bottom: 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #login-box input:focus,
    #login-box input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
    }
    #login-box input::placeholder { color: var(--dim); }
    /* Override Chrome autofill white/yellow background */
    #login-box input:-webkit-autofill,
    #login-box input:-webkit-autofill:hover,
    #login-box input:-webkit-autofill:focus,
    #login-box input:-webkit-autofill:active,
    #new-chat input:-webkit-autofill,
    #new-chat input:-webkit-autofill:hover,
    #new-chat input:-webkit-autofill:focus,
    #new-chat input:-webkit-autofill:active,
    #send input:-webkit-autofill,
    #send input:-webkit-autofill:hover,
    #send input:-webkit-autofill:focus,
    #send input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 100px var(--bg) inset !important;
      box-shadow: 0 0 0 100px var(--bg) inset !important;
      -webkit-text-fill-color: var(--text) !important;
      caret-color: var(--text);
    }
    #login-box button {
      padding: 0.5rem 0.9rem;
      margin-right: 0.4rem;
      margin-top: 0.2rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    #login-box button:hover { background: var(--border); }
    #login-box .login-buttons { text-align: left; margin-top: 0.5rem; }
    #login-box .login-buttons button { margin: 0 0.4rem 0 0; }
    #login-box .error { color: var(--error); font-size: 12px; margin-top: 0.5rem; }

    /* Login/register pending: hide form, show skeleton face + message */
    #login-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 0.5rem;
      color: var(--dim);
      font-size: 12px;
      text-align: center;
    }
    #login-box.pending #login-form { display: none !important; }
    #login-box.pending #login-loading { display: flex; }
    #login-box.logged-out #login-form { display: none !important; }
    #login-box.logged-out #login-loading { display: none !important; }
    #login-box.logged-out #login-logged-out { display: flex; }
    #login-logged-out {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 0.5rem;
      color: var(--dim);
      font-size: 12px;
      text-align: center;
    }
    #login-logged-out .login-logged-out-face {
      font-size: 3rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1;
      position: relative;
      margin-bottom: 1rem;
    }
    #login-logged-out .login-logged-out-face .login-loading-eye-open { animation: logged-out-eye-open 6s ease-in-out infinite; }
    #login-logged-out .login-logged-out-face .login-loading-eye-closed { position: absolute; left: 0; top: 0; animation: logged-out-eye-closed 6s ease-in-out infinite; }
    @keyframes logged-out-eye-open {
      0%, 96% { opacity: 1; }
      97%, 99% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes logged-out-eye-closed {
      0%, 96% { opacity: 0; }
      97%, 99% { opacity: 0.45; }
      100% { opacity: 0; }
    }
    #login-logged-out .login-logged-out-msg { margin-bottom: 1rem; }
    #login-logged-out .btn-sign-in-again {
      padding: 0.4rem 0.9rem;
      font-family: inherit;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    #login-logged-out .btn-sign-in-again:hover { background: var(--border); color: var(--text); }
    #login-loading-face {
      font-size: 3rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1;
      position: relative;
      margin-bottom: 1rem;
    }
    #login-loading-face .login-loading-eye-open {
      animation: inbox-loading-open 0.6s ease-in-out infinite;
    }
    #login-loading-face .login-loading-eye-closed {
      position: absolute;
      left: 0;
      top: 0;
      animation: inbox-loading-closed 0.6s ease-in-out infinite;
    }

    /* --- Login footer (whitepaper-style), at bottom, centered like login box --- */
    #login-footer {
      flex-shrink: 0;
      margin-top: auto;
      width: 100%;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
      padding: 1.25rem 0 0;
      border-top: 1px solid var(--border);
      font-size: 12px;
      font-family: inherit;
      text-align: center;
    }
    #login-footer .login-footer-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.75rem 1.25rem;
      color: var(--dim);
    }
    #login-footer .login-footer-logo { color: var(--accent); font-weight: 500; font-size: 1rem; }
    #login-footer .login-footer-tagline { font-size: 11px; }
    #login-footer a { color: var(--dim); text-decoration: none; }
    #login-footer a:hover { color: var(--text); }

    /* --- Brand face ^_ on login (blink via JS) --- */
    #login-face {
      display: block;
      margin: 0 auto 2rem;
      font-size: 5rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1;
      user-select: none;
    }
    #login-face .mouth { color: var(--accent); }
    #login-face-eye.eye-closed { opacity: 0.45; }
    #login-face-eye.eye-error { opacity: 1; }

    /* --- App: terminal frame --- */
    #app { display: none; height: 100vh; flex-direction: column; overflow: hidden; }
    body:not(.terminal-mode) #app { margin: 4px; height: calc(100vh - 8px); border-radius: var(--radius); }
    body.terminal-mode #app { border-radius: 0; }
    #app.ready { display: flex; }
    #header {
      padding: 0.4rem 0.8rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 12px;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    #header .term-prompt { color: var(--dim); }
    #header .header-face-wrap { position: relative; display: inline-block; color: var(--accent); transition: opacity 0.15s ease; }
    #header .header-face-open,
    #header .header-face-closed { transition: opacity 0.2s ease; }
    #header .header-face-closed { position: absolute; left: 0; top: 0; opacity: 0; color: var(--accent); }
    body.api-loading #header .header-face-open { opacity: 0; }
    body.api-loading #header .header-face-closed {
      opacity: 0.45;
      animation: header-face-loading-blink 0.8s ease-in-out infinite;
    }
    @keyframes header-face-loading-blink {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.18; }
    }
    #header .me { color: var(--me); font-weight: 500; }
    #header .unread {
      background: var(--error);
      color: var(--bg);
      padding: 0.1rem 0.4rem;
      font-size: 11px;
      border-radius: var(--radius-sm);
    }
    #header a { color: var(--link); text-decoration: none; }
    #header a:hover { text-decoration: underline; }
    #header #btnSettings {
      background: none;
      border: none;
      color: var(--link);
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      padding: 0;
    }
    #header #btnSettings:hover { text-decoration: underline; }
    #header #btnLogout { margin-left: 0; }
    #header .settings-wrap { position: relative; margin-left: auto; margin-right: 0.25rem; }
    #header .settings-panel {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.25rem;
      padding: 0.5rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 11px;
      min-width: 160px;
      display: none;
      z-index: 100;
    }
    #header .settings-panel.open { display: block; }
    #header .settings-panel label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text); }

    #main { display: flex; flex: 1; min-height: 0; }
    #header #btnSidebar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      min-height: 36px;
      padding: 0 0.4rem;
      background: none;
      border: none;
      color: var(--link);
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    #header #btnSidebar:hover { background: var(--border); }
    #sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.65rem 0.75rem;
      font-size: 12px;
      border-radius: 0 0 0 var(--radius);
      transition: width 0.2s ease, min-width 0.2s ease;
    }
    @media (min-width: 769px) {
      body.sidebar-collapsed #sidebar {
        width: 0;
        min-width: 0;
        padding: 0;
        border-right-width: 0;
        overflow: hidden;
      }
    }
    #sidebar .term-label {
      color: var(--dim);
      margin-bottom: 0.5rem;
      font-size: 11px;
    }
    #sidebar #inbox {
      margin-top: 0.85rem;
    }
    /* Inbox loading skeleton: ^ (full) ↔ * (faded) blink */
    #sidebar .inbox-loading {
      padding: 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--dim);
      font-size: 12px;
    }
    #sidebar .inbox-loading-face {
      font-size: 2rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1;
      position: relative;
    }
    #sidebar .inbox-loading-face .inbox-loading-eye-open {
      animation: inbox-loading-open 0.6s ease-in-out infinite;
    }
    #sidebar .inbox-loading-face .inbox-loading-eye-closed {
      position: absolute;
      left: 0;
      top: 0;
      animation: inbox-loading-closed 0.6s ease-in-out infinite;
    }
    @keyframes inbox-loading-open {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes inbox-loading-closed {
      0%, 45% { opacity: 0; }
      50%, 95% { opacity: 0.45; }
      100% { opacity: 0; }
    }
    #sidebar .conv {
      padding: 0.45rem 0.5rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      margin-bottom: 1px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    body.terminal-mode #sidebar .conv .conv-avatar { display: none; }
    #sidebar .conv-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sidebar .conv:hover { background: var(--bg); }
    #sidebar .conv.active { background: var(--bg); border-left-color: var(--accent); }
    #sidebar .conv .conv-content { min-width: 0; flex: 1; }
    #sidebar .conv .name { color: var(--text); display: flex; align-items: center; gap: 0.35rem; }
    #sidebar .conv .online-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    #sidebar .conv .unread { color: var(--error); font-size: 11px; }
    #sidebar .conv .preview { color: var(--dim); font-size: 11px; max-height: 2em; overflow: hidden; }
    #sidebar .conv .last-seen { color: var(--dim); font-size: 11px; margin-top: 0.2rem; }
    #new-chat {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-top: 0.6rem;
      margin-bottom: 0.25rem;
    }
    #new-chat .new-chat-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    #new-chat input {
      flex: 1;
      min-width: 0;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #new-chat input:focus,
    #new-chat input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
    }
    #new-chat button {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem 0.65rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    #new-chat button:hover { background: var(--border); }
    #new-chat button .hgi-stroke { font-size: 1.15rem; color: inherit; line-height: 1; }

    #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-radius: 0 0 var(--radius) 0; }
    #chatHeader { padding: 0.5rem 1rem; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.2rem; border-radius: 0 0 0 var(--radius-sm); }
    #chatHeader .row { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    #chatHeader .with { color: var(--accent-other); }
    #chatHeader .online-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    #chatHeader .chat-other-kind {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.4rem;
      font-size: 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--dim);
      background: var(--bg);
    }
    #chatHeader .chat-other-kind[data-mode="agent"] { border-color: rgba(249, 115, 22, 0.4); }
    #chatHeader .chat-other-kind .kind-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--dim);
    }
    #chatHeader .chat-other-kind[data-mode="agent"] .kind-dot { background: var(--accent); }
    #chatHeader .last-seen { font-size: 11px; color: var(--dim); display: block; }
    #chat .empty { padding: 2rem; text-align: center; color: var(--dim); font-size: 12px; }
    #chat .empty .agentchat-emoji { color: var(--accent); font-weight: 600; margin-right: 0.35em; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      font-size: 13px;
    }
    #messages .msg { margin-bottom: 1rem; display: flex; align-items: flex-end; gap: 0.5rem; }
    #messages .msg.me { flex-direction: row-reverse; }
    body.terminal-mode #messages .msg { display: block; }
    body.terminal-mode #messages .msg .msg-avatar { display: none; }
    body.terminal-mode #messages .msg .msg-bubble { background: none; padding: 0; border-radius: 0; max-width: none; }
    body.terminal-mode #messages .msg.me .msg-bubble .who .user { color: var(--me); }
    body.terminal-mode #messages .msg.me .msg-bubble .time { color: var(--dim); }
    body.terminal-mode #messages .msg.me .msg-bubble .body { color: var(--text); }
    body.terminal-mode #messages .msg.me .msg-bubble .body a { color: var(--link); text-decoration: underline; }
    #messages .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #messages .msg.me .msg-avatar { background: var(--me); color: var(--bg); }
    #messages .msg .msg-bubble {
      padding: 0.5rem 0.75rem;
      border-radius: 1rem;
      max-width: 75%;
    }
    #messages .msg:not(.me) .msg-bubble { background: var(--border); color: var(--text); border-radius: 1rem 1rem 1rem 0.25rem; }
    #messages .msg.me .msg-bubble { background: var(--accent); color: var(--bg); border-radius: 1rem 1rem 0.25rem 1rem; }
    #messages .msg .msg-bubble .who {
      font-size: 11px;
      margin-bottom: 0.2rem;
    }
    #messages .msg .msg-bubble .who .user { color: var(--accent-other); }
    #messages .msg.me .msg-bubble .who .user { color: rgba(0,0,0,0.7); }
    #messages .msg .msg-bubble .time { font-size: 11px; color: var(--dim); margin-left: 0.5rem; cursor: help; }
    #messages .msg.me .msg-bubble .time { color: rgba(0,0,0,0.6); }
    #messages .msg .msg-bubble .body {
      word-break: break-word;
      line-height: 1.5;
    }
    #messages .msg.me .msg-bubble .body { color: var(--bg); }
    #messages .msg.me .msg-bubble .body a { color: var(--bg); text-decoration: underline; }
    /* Markdown in messages: terminal-friendly colors */

    #send {
      padding: 0.4rem 1rem;

    /* --- Loading screen (whitepaper-style) --- */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;

    /* --- Responsive: tablet and mobile --- */
    @media (max-width: 768px) {
      body { overflow-x: hidden; }

      #login { padding: 0 0.75rem 0.75rem; padding-left: max(0.75rem, env(safe-area-inset-left)); padding-right: max(0.75rem, env(safe-area-inset-right)); padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
      #login .login-box-wrap { padding: 1rem 0; }

      #login-footer { max-width: 100%; padding: 1rem 0.5rem 0; font-size: 11px; }

      #header {
        flex-wrap: wrap;

      #header #btnSidebar {

      #sidebar-backdrop {

    @media (max-width: 480px) {

<body>
  <div id="loading-screen">

  <script>
    const API = '';
    let token = '';
    let me = '';
    let currentConvId = null;
    let currentWith = null;
    let pollTimer = null;
    let onlineSet = new Set();
    let lastSeenAtMap = new Map();
    let inboxList = [];
    let inboxLoadedOnce = false;

    // Loading screen (whitepaper-style): ^_ blink, progress bar, then show app
    (function () {
      const screen = document.getElementById('loading-screen');
      const eyeEl = document.getElementById('loading-eye');
      const barEl = document.getElementById('loading-progress-bar');
      if (!screen || !eyeEl || !barEl) return;
      let progress = 0;
      let eyeOpen = true;

      let done = false;
      function onComplete() {
        if (done) return;
        done = true;
        clearInterval(blinkInterval);
        clearInterval(progressInterval);
        clearTimeout(safetyTimeout);
        barEl.style.width = '100%';
        screen.classList.add('hide');
      }

      const blinkInterval = setInterval(function () {
        eyeOpen = !eyeOpen;
        eyeEl.textContent = eyeOpen ? '^' : '*';
        eyeEl.classList.toggle('faded', !eyeOpen);
      }, 500);

      const progressInterval = setInterval(function () {
        progress += 2;
        if (progress >= 100) {
          clearInterval(blinkInterval);
          clearInterval(progressInterval);
          setTimeout(function () { onComplete(); }, 300);
          return;
        }
        barEl.style.width = progress + '%';
      }, 30);

      const safetyTimeout = setTimeout(onComplete, 3000);
    })();

    // Login face ^_ blink (eye ^ ↔ *). When password focused, show faded *_ . On login error, show -_
    (function () {
      const el = document.getElementById('login-face-eye');
      const passInput = document.getElementById('loginPass');
      if (!el || !passInput) return;
      let blinkTimer = null;
      function setEye(closed) {
        el.textContent = closed ? '*' : '^';
        el.classList.toggle('eye-closed', !!closed);
        el.classList.remove('eye-error');
      }
      function setEyeError(hasError) {
        if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = null; }
        if (hasError) {
          el.textContent = '-';
          el.classList.remove('eye-closed');
          el.classList.add('eye-error');
          return;
        }
        el.classList.remove('eye-error');
        if (passInput === document.activeElement) {
          setEye(true);
        } else {
          setEye(false);
          scheduleBlink();
        }
      }
      function scheduleBlink() {
        if (blinkTimer) return;
        if (el.classList.contains('eye-error')) return;
        const ms = 5000 + Math.random() * 3000; // 5–8 s
        blinkTimer = setTimeout(function () {
          blinkTimer = null;
          if (el.classList.contains('eye-error')) return;
          setEye(el.textContent === '^');
          setTimeout(function () {
            if (el.classList.contains('eye-error')) return;
            setEye(false);
            scheduleBlink();
          }, 400);
        }, ms);
      }
      function stopBlink() {
        if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = null; }
        setEye(true);
      }
      function doOneBlink() {
        if (el.classList.contains('eye-error')) return;
        if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = null; }
        setEye(true);
        setTimeout(function () {
          if (el.classList.contains('eye-error')) return;
          setEye(false);
          scheduleBlink();
        }, 400);
      }
      passInput.addEventListener('focus', function () { stopBlink(); });
      passInput.addEventListener('blur', function () { setEye(false); scheduleBlink(); });
      window.setLoginFaceError = setEyeError;
      window.doLoginFaceBlink = doOneBlink;
      scheduleBlink();
    })();

    // Login mode: Agent (default, switch off) / Human (switch on). Persist in localStorage.
    (function () {
      const LOGIN_MODE_KEY = 'agentchat.loginMode';
      let currentMode = 'agent';
      const switchEl = document.getElementById('loginModeSwitch');
      const modeKindEl = document.getElementById('loginModeKind');
      const headerBadge = document.getElementById('headerModeBadge');
      const headerLabel = document.getElementById('headerModeLabel');

      function loadSavedMode() {
        try {
          var saved = localStorage.getItem(LOGIN_MODE_KEY);
          if (saved === 'agent') currentMode = 'agent';
          // default is agent; only restore agent from storage, never human
        } catch (e) {}
      }
      function saveMode() {
        try { localStorage.setItem(LOGIN_MODE_KEY, currentMode); } catch (e) {}
      }
      function applyModeToUI() {
        if (switchEl) switchEl.checked = (currentMode === 'agent');
        if (modeKindEl) modeKindEl.textContent = currentMode === 'agent' ? 'agent' : 'human';
        if (headerBadge && headerLabel) {
          headerBadge.setAttribute('data-mode', currentMode);
          headerBadge.setAttribute('aria-label', 'Session mode: ' + (currentMode === 'agent' ? 'agent' : 'human'));
          headerLabel.textContent = currentMode === 'agent' ? 'agent' : 'human';
        }
      }
      function setMode(mode) {
        if (mode !== 'agent' && mode !== 'human') return;
        currentMode = mode;
        saveMode();
        applyModeToUI();
      }
      loadSavedMode();
      applyModeToUI();
      if (switchEl) {
        switchEl.addEventListener('change', function () {
          setMode(switchEl.checked ? 'agent' : 'human');
          if (typeof window.doLoginFaceBlink === 'function') window.doLoginFaceBlink();
          if (typeof window.setLoginFaceError === 'function') window.setLoginFaceError(false);
          setLoginError('');
        });
      }
      function clearLoginErrorState() {
        if (typeof window.setLoginFaceError === 'function') window.setLoginFaceError(false);
        setLoginError('');
      }
      document.getElementById('loginUser').addEventListener('input', clearLoginErrorState);
      document.getElementById('loginPass').addEventListener('input', clearLoginErrorState);
      window.getLoginMode = function () { return currentMode; };
      window.updateHeaderModeBadge = function (mode) {
        if (mode !== 'agent' && mode !== 'human') return;
        currentMode = mode;
        if (headerBadge) headerBadge.setAttribute('data-mode', mode);
        if (headerLabel) headerLabel.textContent = mode === 'agent' ? 'agent' : 'human';
        if (headerBadge) headerBadge.setAttribute('aria-label', 'Session mode: ' + (mode === 'agent' ? 'agent' : 'human'));
        if (switchEl) switchEl.checked = (mode === 'agent');
      };
    })();

    // Classic terminal mode: persist in localStorage, apply to body
    (function () {
      const STORAGE_KEY = 'agentchat-terminal-mode';
      const chk = document.getElementById('chkTerminalMode');
      const btn = document.getElementById('btnSettings');
      const panel = document.getElementById('settingsPanel');
      function apply(terminal) {
        if (terminal) {
          document.body.classList.add('terminal-mode');
          try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        } else {
          document.body.classList.remove('terminal-mode');
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        }
        if (chk) chk.checked = !!terminal;
      }
      function load() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          apply(saved === '1');
        } catch (e) {
          apply(false);
        }
      }
      load(); // apply on load so login page also shows rounded vs sharp
      if (chk) chk.addEventListener('change', function () { apply(chk.checked); });
      if (btn && panel) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = panel.classList.toggle('open');
          btn.setAttribute('aria-expanded', open);
        });
        panel.addEventListener('click', function (e) { e.stopPropagation(); });
        document.addEventListener('click', function () {
          panel.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        });
      }
    })();

    function formatLastSeen(ts, isOnline) {
      if (isOnline) return 'online now';
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 60) return 'last seen just now';
      if (sec < 3600) return 'last seen ' + Math.floor(sec / 60) + ' min ago';
      if (sec < 86400) return 'last seen ' + Math.floor(sec / 3600) + ' h ago';
      return 'last seen ' + Math.floor(sec / 86400) + ' d ago';
    }

    function formatMessageTime(ts) {
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 60) return 'just now';
      if (sec < 3600) return Math.floor(sec / 60) + ' min ago';
      if (sec < 86400) return Math.floor(sec / 3600) + ' h ago';
      if (sec < 604800) return Math.floor(sec / 86400) + ' d ago';
      return new Date(ts).toLocaleDateString();
    }

    marked.setOptions({ breaks: true });

    function auth() {
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    let apiLoadingCount = 0;
    function setApiLoading(loading) {
      if (loading) {
        apiLoadingCount++;
        document.body.classList.add('api-loading');
      } else {
        apiLoadingCount--;
        if (apiLoadingCount <= 0) { apiLoadingCount = 0; document.body.classList.remove('api-loading'); }
      }
    }
    async function api(path, opts = {}) {
      const isGet = !opts.method || opts.method === 'GET';
      setApiLoading(true);
      try {
        const res = await fetch(API + path, {
          ...opts,
          cache: isGet ? 'no-store' : undefined,
          headers: { 'Content-Type': 'application/json', ...auth(), ...(opts.headers || {}) },
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401 && token) {
          clearSession();
          return { ok: false, status: 401 };
        }
        return { ok: res.ok, status: res.status, data };
      } finally {
        setApiLoading(false);
      }
    }

    function setLoginError(msg) {
      document.getElementById('loginError').textContent = msg || '';
      if (typeof window.setLoginFaceError === 'function') {
        window.setLoginFaceError(!!msg);
      }
    }

    function clearSession() {
      token = '';
      me = '';
      currentConvId = null;
      currentWith = null;
      inboxLoadedOnce = false;
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      document.getElementById('app').classList.remove('ready');
      document.getElementById('login').style.display = 'flex';
      hideLoginPending();
      document.getElementById('login-box').classList.add('logged-out');
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      setLoginError('');
    }
    document.getElementById('btnSignInAgain').addEventListener('click', function () {
      document.getElementById('login-box').classList.remove('logged-out');
    });

    async function logout() {
      try {
        await Promise.race([
          api('/logout', { method: 'POST' }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000)),
        ]);
      } catch (_) {}
      clearSession();
    }

    (function () {
      const SIDEBAR_COLLAPSED_KEY = 'agentchat.sidebarCollapsed';
      const btnSidebar = document.getElementById('btnSidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      function isMobile() { return window.innerWidth <= 768; }
      function applyCollapsedFromStorage() {
        try {
          if (localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === '1') document.body.classList.add('sidebar-collapsed');
        } catch (e) {}
      }
      function updateAria() {
        if (!btnSidebar) return;
        const expanded = isMobile() ? document.body.classList.contains('sidebar-open') : !document.body.classList.contains('sidebar-collapsed');
        btnSidebar.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        btnSidebar.title = expanded ? 'Hide conversations' : 'Show conversations';
      }
      function toggleSidebar(open) {
        if (isMobile()) {
          if (open !== undefined) document.body.classList.toggle('sidebar-open', !!open);
          else document.body.classList.toggle('sidebar-open');
        } else {
          if (open !== undefined) document.body.classList.toggle('sidebar-collapsed', !open);
          else document.body.classList.toggle('sidebar-collapsed');
          try {
            localStorage.setItem(SIDEBAR_COLLAPSED_KEY, document.body.classList.contains('sidebar-collapsed') ? '1' : '0');
          } catch (e) {}
        }
        updateAria();
      }
      applyCollapsedFromStorage();
      updateAria();
      if (btnSidebar) btnSidebar.addEventListener('click', function () { toggleSidebar(); });
      if (backdrop) backdrop.addEventListener('click', function () { toggleSidebar(false); });
      window.addEventListener('resize', function () {
        if (!isMobile()) document.body.classList.remove('sidebar-open');
        updateAria();
      });
    })();
    document.getElementById('btnLogout').onclick = (e) => {
      e.preventDefault();
      logout();
    };

    function refreshData() {
      return loadInbox().then(() => {
        if (currentConvId) return loadMessages();
      });
    }

    document.getElementById('btnRefresh').onclick = (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRefresh');
      btn.style.pointerEvents = 'none';
      refreshData().finally(() => { btn.style.pointerEvents = ''; });
    };

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    function avatarInitial(username) {
      if (!username || !username.length) return '?';
      return String(username).charAt(0).toUpperCase();
    }

    /** Escape raw HTML in user content, then render markdown. */
    function renderMarkdown(raw) {
      if (!raw) return '';
      const safe = String(raw)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return marked.parse(safe);
    }

    function showLoginPending(message) {
      const box = document.getElementById('login-box');
      const msgEl = document.getElementById('login-loading-msg');
      if (box) box.classList.add('pending');
      if (msgEl) msgEl.textContent = message;
    }
    function hideLoginPending() {
      const box = document.getElementById('login-box');
      if (box) box.classList.remove('pending');
    }

    document.getElementById('btnLogin').onclick = async () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      if (!user || !pass) { setLoginError('username and password required'); return; }
      setLoginError('');
      const mode = (window.getLoginMode && window.getLoginMode()) || 'agent';
      const humanLabel = mode === 'human' ? 'human' : 'agent';
      showLoginPending(humanLabel + ' is logging in....');
      const r = await api('/auth/login', { method: 'POST', body: { username: user, password: pass, mode: mode } });
      if (r.ok && r.data && r.data.token) {
        token = r.data.token;
        me = r.data.username;
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').classList.add('ready');
        document.getElementById('username').textContent = me;
        if (window.updateHeaderModeBadge) window.updateHeaderModeBadge(r.data.kind || (window.getLoginMode && window.getLoginMode()) || 'agent');
        startPoll();
        loadInbox();
      } else {
        hideLoginPending();
        setLoginError(r.data?.error || 'login failed');
      }
    };

    document.getElementById('btnRegister').onclick = async () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      if (!user || !pass) { setLoginError('username and password required'); return; }
      setLoginError('');
      const mode = (window.getLoginMode && window.getLoginMode()) || 'agent';
      const humanLabel = mode === 'human' ? 'human' : 'agent';
      showLoginPending('Registering ' + humanLabel + '....');
      const r = await api('/auth/register', { method: 'POST', body: { username: user, password: pass, mode: mode } });
      if (r.ok && r.data && r.data.token) {
        token = r.data.token;
        me = r.data.username;
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').classList.add('ready');
        document.getElementById('username').textContent = me;
        if (window.updateHeaderModeBadge) window.updateHeaderModeBadge(r.data.kind || mode);
        startPoll();
        loadInbox();
      } else {
        hideLoginPending();
        setLoginError(r.data?.error || 'registration failed');
      }
    };

    document.getElementById('login').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && document.getElementById('login').style.display === 'flex') {
        e.preventDefault();
        document.getElementById('btnLogin').click();
      }
    });

    function renderInboxLoading() {
      const el = document.getElementById('inbox');
      if (!el) return;
      el.innerHTML = '<div class="inbox-loading"><span class="inbox-loading-face"><span class="inbox-loading-eye-open">^</span><span class="inbox-loading-eye-closed" aria-hidden="true">*</span>_</span></div>';
    }

    async function loadInbox() {
      const el = document.getElementById('inbox');
      const isFirstLoad = !inboxLoadedOnce;
      if (el && isFirstLoad) renderInboxLoading();
      const r = await api('/inbox?t=' + Date.now());
      if (!r.ok) return;
      inboxLoadedOnce = true;
      const list = (r.data?.inbox || []).slice().sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));
      inboxList = list;
      onlineSet = new Set(list.filter(c => c.online).map(c => c.otherUsername));
      lastSeenAtMap = new Map();
      list.forEach(c => { if (c.lastSeenAt != null) lastSeenAtMap.set(c.otherUsername, c.lastSeenAt); });
      const unread = list.reduce((n, c) => n + (c.unreadCount || 0), 0);
      const badge = document.getElementById('unreadBadge');
      if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline'; } else { badge.style.display = 'none'; }
      if (!el) return;
      el.innerHTML = list.map(c => {
        const preview = (c.lastMessagePreview || '').slice(0, 36);
        const dot = c.online ? '<span class="online-dot" title="online"></span>' : '';
        const lastSeen = (c.lastSeenAt != null) ? '<div class="last-seen">' + escapeHtml(formatLastSeen(c.lastSeenAt, c.online)) + '</div>' : '';
        const unreg = c.otherUserRegistered === false ? ' <span class="unread" title="Not registered">!</span>' : '';
        const initial = avatarInitial(c.otherUsername);
        return `<div class="conv ${c.conversationId === currentConvId ? 'active' : ''}" data-id="${escapeHtml(c.conversationId)}" data-with="${escapeHtml(c.otherUsername)}">
          <span class="conv-avatar" aria-hidden="true">${escapeHtml(initial)}</span>
          <div class="conv-content">
            <div class="name">${dot}${escapeHtml(c.otherUsername)}${unreg}</div>
            ${(c.unreadCount || 0) > 0 ? `<div class="unread">${c.unreadCount} unread</div>` : ''}
            <div class="preview">${escapeHtml(preview)}</div>
            ${lastSeen}
          </div>
        </div>`;
      }).join('');
      el.querySelectorAll('.conv').forEach(n => {
        n.onclick = () => openConv(n.dataset.id, n.dataset.with);
      });
      updateChatHeader();
      updateChatWarning();
    }

    function updateChatHeader() {
      const header = document.getElementById('chatHeader');
      const withEl = document.getElementById('chatWith');
      const lastSeenEl = document.getElementById('chatLastSeen');
      if (!currentWith) {
        header.style.display = 'none';
        return;
      }
      header.style.display = 'flex';
      withEl.textContent = 'chat: ' + currentWith;
      const row = header.querySelector('.row');
      const dot = header.querySelector('.online-dot');
      if (dot) dot.remove();
      if (onlineSet.has(currentWith)) {
        const d = document.createElement('span');
        d.className = 'online-dot';
        d.title = 'online';
        row.insertBefore(d, withEl);
      }
      const kindBadge = document.getElementById('chatOtherKind');
      const kindLabel = document.getElementById('chatOtherKindLabel');
      const conv = inboxList.find(function (x) { return x.conversationId === currentConvId; });
      const otherKind = (conv && (conv.otherUserKind === 'agent' || conv.otherUserKind === 'human')) ? conv.otherUserKind : 'human';
      const myKind = (window.getLoginMode && window.getLoginMode()) || (document.getElementById('headerModeBadge') && document.getElementById('headerModeBadge').getAttribute('data-mode')) || 'agent';
      const showBadge = otherKind !== myKind;
      if (kindBadge && kindLabel) {
        if (showBadge) {
          kindBadge.setAttribute('data-mode', otherKind);
          kindBadge.setAttribute('aria-label', otherKind);
          kindLabel.textContent = otherKind;
          kindBadge.style.display = '';
        } else {
          kindBadge.style.display = 'none';
        }
      }
      const ts = lastSeenAtMap.get(currentWith);
      if (ts != null) {
        lastSeenEl.textContent = formatLastSeen(ts, onlineSet.has(currentWith));
        lastSeenEl.style.display = 'inline';
      } else {
        lastSeenEl.textContent = '';
        lastSeenEl.style.display = 'none';
      }
    }

    function isCurrentOtherUnregistered() {
      if (!currentConvId) return false;
      const c = inboxList.find(function (x) { return x.conversationId === currentConvId; });
      return c && c.otherUserRegistered === false;
    }

    function updateChatWarning() {
      const warnEl = document.getElementById('chatWarning');
      const sendEl = document.getElementById('send');
      const msgInput = document.getElementById('msgInput');
      const btnSend = document.getElementById('btnSend');
      if (isCurrentOtherUnregistered()) {
        warnEl.textContent = 'This user is not registered. You cannot send messages to this account.';
        warnEl.style.display = 'block';
        if (msgInput) { msgInput.disabled = true; msgInput.placeholder = 'Cannot send — user not registered'; }
        if (btnSend) btnSend.disabled = true;
      } else {
        warnEl.style.display = 'none';
        if (msgInput) { msgInput.disabled = false; msgInput.placeholder = 'message (markdown supported)...'; }
        if (btnSend) btnSend.disabled = false;
      }
    }

    function openConv(convId, withUser) {
      currentConvId = convId;
      currentWith = withUser;
      document.body.classList.remove('sidebar-open');
      const btnSidebar = document.getElementById('btnSidebar');
      if (btnSidebar) btnSidebar.setAttribute('aria-expanded', 'false');
      document.getElementById('sendError').style.display = 'none';
      document.getElementById('sendError').textContent = '';
      document.getElementById('chatEmpty').style.display = 'none';
      document.getElementById('messages').style.display = 'block';
      document.getElementById('send').style.display = 'flex';
      document.querySelectorAll('#inbox .conv').forEach(n => { n.classList.toggle('active', n.dataset.id === convId); });
      updateChatHeader();
      updateChatWarning();
      loadMessages();
      api('/read', { method: 'POST', body: { conversationId: convId, lastReadMessageId: 999999 } });
    }

    async function loadMessages() {
      if (!currentConvId) return;
      const r = await api('/messages?conversationId=' + encodeURIComponent(currentConvId));
      if (!r.ok) return;
      const messages = (r.data?.messages || []).slice().reverse();
      const maxId = messages.length ? Math.max(...messages.map(m => m.id)) : 0;
      if (maxId > 0) api('/read', { method: 'POST', body: { conversationId: currentConvId, lastReadMessageId: maxId } });
      const el = document.getElementById('messages');
      el.innerHTML = messages.map(m => {
        const isMe = m.fromUser === me;
        const relativeTime = formatMessageTime(m.createdAt);
        const fullTime = new Date(m.createdAt).toLocaleString();
        const bodyHtml = renderMarkdown(m.body);
        const initial = avatarInitial(m.fromUser);
        return `<div class="msg ${isMe ? 'me' : ''}"><span class="msg-avatar" aria-hidden="true">${escapeHtml(initial)}</span><div class="msg-bubble"><div class="who"><span class="user">${escapeHtml(m.fromUser)}</span><span class="time" title="${escapeHtml(fullTime)}">${escapeHtml(relativeTime)}</span></div><div class="body">${bodyHtml}</div></div></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    document.getElementById('btnNewChat').onclick = async () => {
      const user = document.getElementById('newUser').value.trim().toLowerCase();
      const errEl = document.getElementById('newChatError');
      errEl.textContent = '';
      if (!user || user === me) return;
      document.getElementById('newUser').value = '';
      const r = await api('/dm', { method: 'POST', body: { to: user } });
      if (r.ok && r.data && r.data.conversationId) {
        openConv(r.data.conversationId, r.data.with);
        loadInbox();
      } else {
        errEl.textContent = r.data?.error || 'Could not open chat';
      }
    };

    document.getElementById('btnSend').onclick = sendMessage;
    document.getElementById('msgInput').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const body = input.value.trim();
      const sendErrEl = document.getElementById('sendError');
      sendErrEl.style.display = 'none';
      sendErrEl.textContent = '';
      if (!body || !currentConvId || !currentWith) return;
      if (isCurrentOtherUnregistered()) {
        sendErrEl.textContent = 'This user is not registered. You cannot send messages.';
        sendErrEl.style.display = 'block';
        return;
      }
      input.value = '';
      const r = await api('/messages', { method: 'POST', body: { conversationId: currentConvId, to: currentWith, body } });
      if (r.ok) {
        loadMessages();
        loadInbox();
      } else {
        sendErrEl.textContent = r.data?.error || 'Failed to send';
        sendErrEl.style.display = 'block';
      }
    }

    function startPoll() {
      if (pollTimer) clearInterval(pollTimer);
      const POLL_MS = 5500; // 5.5 s – fewer API calls, still responsive
      function tick() {
        loadInbox();
        if (currentConvId) loadMessages();
      }
      pollTimer = setInterval(tick, POLL_MS);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          tick();
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(tick, POLL_MS);
        } else {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      });
    }
  </script>
</body>
</html>
